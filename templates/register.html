{% extends "base.html" %}
{% block title %}注册 - 问卷系统{% endblock %}
{% block content %}
<div class="auth-form">
    <h2>注册</h2>
    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="form-group">
            <label>用户名（3-20个字符）</label>
            <input type="text" name="username" required minlength="3" maxlength="20" autofocus>
        </div>
        <div class="form-group">
            <label>密码（至少6个字符）</label>
            <input type="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" name="confirm" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary">注册</button>
    </form>
    <p class="auth-link">已有账号？<a href="{{ url_for('auth.login') }}">登录</a></p>
</div>
{% endblock %}
