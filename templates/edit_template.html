{% extends "base.html" %}
{% block title %}编辑题目 - {{ template.title }}{% endblock %}
{% block content %}
<div class="edit-template">
    <div class="page-header">
        <h2>编辑题目</h2>
        <a href="{{ url_for('question_library.view_template', template_id=template._id) }}" class="btn">返回</a>
    </div>

    <form method="POST" action="{{ url_for('question_library.edit_template', template_id=template._id) }}">
        <div class="form-card">
            <div class="form-group">
                <label>题目标题</label>
                <input type="text" name="title" value="{{ template.title }}" required>
            </div>

            <div class="form-group">
                <label>题目类型</label>
                <select name="type" id="edit-type" onchange="toggleEditOptions()">
                    <option value="single_choice" {% if template.type == 'single_choice' %}selected{% endif %}>单选题</option>
                    <option value="multiple_choice" {% if template.type == 'multiple_choice' %}selected{% endif %}>多选题</option>
                    <option value="text_fill" {% if template.type == 'text_fill' %}selected{% endif %}>文本填空</option>
                    <option value="number_fill" {% if template.type == 'number_fill' %}selected{% endif %}>数字填空</option>
                </select>
            </div>

            <div class="form-group" id="edit-options-group">
                <label>选项</label>
                <div id="edit-options-container">
                    {% for opt in template.options %}
                    <div class="option-row">
                        <input type="text" name="options[]" value="{{ opt }}">
                        <button type="button" onclick="this.parentElement.remove()" class="btn btn-sm btn-danger">×</button>
                    </div>
                    {% endfor %}
                </div>
                <button type="button" onclick="addEditOption()" class="btn btn-sm">+ 添加选项</button>
            </div>

            <div class="form-group" id="edit-validation-group">
                <label>校验规则</label>
                <div id="edit-validation-container"></div>
            </div>

            <div class="form-group">
                <label><input type="checkbox" name="required" {% if template.required %}checked{% endif %}> 必填</label>
            </div>

            <div class="form-group version-option">
                <label>
                    <input type="checkbox" name="create_new_version">
                    创建为新版本（不勾选则直接修改当前版本）
                </label>
                <p class="help-text">
                    如果该题目已被其他问卷使用，建议创建新版本以保留原始数据。
                </p>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="{{ url_for('question_library.view_template', template_id=template._id) }}" class="btn">取消</a>
            </div>
        </div>
    </form>
</div>

<script>
function toggleEditOptions() {
    const type = document.getElementById('edit-type').value;
    const optionsGroup = document.getElementById('edit-options-group');
    const validationGroup = document.getElementById('edit-validation-group');
    const validationContainer = document.getElementById('edit-validation-container');

    if (type === 'single_choice' || type === 'multiple_choice') {
        optionsGroup.style.display = 'block';
        validationGroup.style.display = type === 'multiple_choice' ? 'block' : 'none';
        if (type === 'multiple_choice') {
            validationContainer.innerHTML = `
                <div class="validation-row">
                    <label>最少选择：</label>
                    <input type="number" name="min_select" min="0" value="{{ template.validation.get('min_select', '') }}" placeholder="不限">
                </div>
                <div class="validation-row">
                    <label>最多选择：</label>
                    <input type="number" name="max_select" min="0" value="{{ template.validation.get('max_select', '') }}" placeholder="不限">
                </div>
            `;
        }
    } else {
        optionsGroup.style.display = 'none';
        validationGroup.style.display = 'block';
        if (type === 'text_fill') {
            validationContainer.innerHTML = `
                <div class="validation-row">
                    <label>最少字数：</label>
                    <input type="number" name="min_length" min="0" value="{{ template.validation.get('min_length', '') }}" placeholder="不限">
                </div>
                <div class="validation-row">
                    <label>最多字数：</label>
                    <input type="number" name="max_length" min="0" value="{{ template.validation.get('max_length', '') }}" placeholder="不限">
                </div>
            `;
        } else if (type === 'number_fill') {
            validationContainer.innerHTML = `
                <div class="validation-row">
                    <label>最小值：</label>
                    <input type="number" name="min_value" step="any" value="{{ template.validation.get('min_value', '') }}" placeholder="不限">
                </div>
                <div class="validation-row">
                    <label>最大值：</label>
                    <input type="number" name="max_value" step="any" value="{{ template.validation.get('max_value', '') }}" placeholder="不限">
                </div>
                <div class="validation-row">
                    <label><input type="checkbox" name="must_be_integer" {% if template.validation.get('must_be_integer') %}checked{% endif %}> 必须为整数</label>
                </div>
            `;
        }
    }
}

function addEditOption() {
    const container = document.getElementById('edit-options-container');
    const row = document.createElement('div');
    row.className = 'option-row';
    row.innerHTML = `
        <input type="text" name="options[]" placeholder="新选项">
        <button type="button" onclick="this.parentElement.remove()" class="btn btn-sm btn-danger">×</button>
    `;
    container.appendChild(row);
}

toggleEditOptions();
</script>
{% endblock %}
